<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra Admin Login</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0420;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #130929;
            border: 2px solid #7c3aed;
            border-radius: 16px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 28px;
            color: #a855f7;
            margin-bottom: 8px;
        }

        .brand { font-size: 32px; font-weight: 900; letter-spacing: 4px; color: #a855f7; text-shadow: 0 0 18px rgba(168,85,247,0.5); display: block; margin-bottom: 4px; }

        .login-box p {
            color: #8899bb;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .cog {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            background: #0c0520;
            border: 1px solid #4c1d95;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #a855f7;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5b21b6;
        }

        .error {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid #dc2626;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #a855f7;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover { text-decoration: underline; }
    </style>
    <link rel="stylesheet" href="/hydra-theme.css">
</head>
<body>

<div class="login-box">
    <span class="cog">⚙️</span>
    <span class="brand">HYDRA</span>
    <h1>Admin Setup</h1>
    <p>Enter your admin credentials to continue</p>

    <div id="error-msg" class="error" style="display:none">
        Incorrect username or password.
    </div>
    <div id="discord-required-msg" class="error" style="display:none">
        You must sign in with an approved Discord account before using admin login.
        <a href="/auth/discord" style="color:#fff">Sign in with Discord</a>
    </div>

    <form method="POST" action="/admin-login">
        <input type="text" name="username" placeholder="Username" required autocomplete="off">
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <a class="back" href="/">← Back to site</a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
        if (params.get("error") === "discord_required") {
            document.getElementById("discord-required-msg").style.display = "block";
        } else {
            document.getElementById("error-msg").style.display = "block";
        }
    }
    fetch("/user").then(r => r.json()).then(user => {
        if (user.discordAdminRequired && !user.isAdmin) {
            document.querySelector("form").style.display = "none";
            document.getElementById("discord-required-msg").style.display = "block";
        }
    }).catch(() => {});
</script>

</body>
</html>
