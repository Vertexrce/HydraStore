<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex 6X Admin Login</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050b18;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #0c172b;
            border: 2px solid #2563eb;
            border-radius: 16px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 28px;
            color: #4d8dff;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #8899bb;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .cog {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            background: #07101f;
            border: 1px solid #1c3c8a;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4d8dff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid #dc2626;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #4d8dff;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-box">
    <span class="cog">⚙️</span>
    <h1>Admin Setup</h1>
    <p>Enter your admin credentials to continue</p>

    <div id="error-msg" class="error" style="display:none">
        Incorrect username or password.
    </div>

    <form method="POST" action="/admin-login">
        <input type="text" name="username" placeholder="Username" required autocomplete="off">
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <a class="back" href="/">← Back to site</a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
        document.getElementById("error-msg").style.display = "block";
    }
</script>

</body>
</html>
