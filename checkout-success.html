<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful — Solarix</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0420; color: #e0e6f0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #130929; border: 1px solid #7c3aed; border-radius: 20px; padding: 52px 44px; max-width: 520px; width: 100%; text-align: center; }
        .icon { font-size: 56px; margin-bottom: 20px; }
        h1 { font-size: 30px; font-weight: 800; color: #fff; margin-bottom: 10px; }
        .sub { font-size: 15px; color: #7c3aed; line-height: 1.6; margin-bottom: 30px; }
        .brand { font-size: 13px; color: #3d1a70; margin-top: 24px; }
        .brand a { color: #7c3aed; text-decoration: none; }
        .btn { display: inline-block; padding: 14px 32px; background: #7c3aed; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 15px; transition: background 0.15s; margin: 6px; }
        .btn:hover { background: #5b21b6; }
        .btn-outline { background: transparent; border: 2px solid #7c3aed; color: #a855f7; }
        .btn-outline:hover { background: rgba(124,58,237,0.15); }
        .download-section { background: #0c0520; border: 1px solid #1e0840; border-radius: 12px; padding: 20px; margin-bottom: 24px; display: none; }
        .download-section h3 { font-size: 16px; color: #fff; margin-bottom: 8px; }
        .download-section p { font-size: 13px; color: #7c3aed; margin-bottom: 14px; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✅</div>
    <h1>Payment Successful!</h1>
    <p class="sub">Your purchase has been processed. If you had a Discord account linked, your role will be assigned automatically within a few seconds.</p>

    <div id="download-section" class="download-section">
        <h3>📁 Your Download</h3>
        <p>Your digital item is ready to download.</p>
        <a id="download-btn" class="btn" href="#">⬇ Download Now</a>
    </div>

    <a href="/store.html" class="btn">← Back to Store</a>
    <a href="/" class="btn btn-outline">Home</a>

    <p class="brand">Solarix · <a href="https://discord.gg/playsolarix" target="_blank">discord.gg/playsolarix</a></p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");
if (sessionId) {
    fetch(`/api/checkout-info?session_id=${sessionId}`)
        .then(r => r.json())
        .then(data => {
            if (data.zipUrl) {
                const section = document.getElementById("download-section");
                const btn = document.getElementById("download-btn");
                section.style.display = "block";
                btn.href = data.zipUrl;
            }
        }).catch(() => {});
}
</script>
</body>
</html>
