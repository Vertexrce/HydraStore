<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kits — Solarix</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0420; color: #e0e6f0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }

nav {
    background: rgba(8,12,20,0.95);
    border-bottom: 1px solid #1e0a40;
    padding: 0 40px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo-text { font-size: 18px; font-weight: 900; color: #a855f7; letter-spacing: 3px; text-shadow: 0 0 12px rgba(168,85,247,0.4); }
.nav-links { display: flex; gap: 6px; align-items: center; list-style: none; }
.nav-links a { color: #9a71d4; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 6px; transition: color 0.15s, background 0.15s; }
.nav-links a:hover, .nav-links a.active { color: #fff; background: rgba(255,255,255,0.05); }
.nav-links a.active { color: #a855f7; }
.nav-right { display: flex; align-items: center; gap: 6px; }
.nav-cog { color: #334155; text-decoration: none; font-size: 18px; padding: 6px 8px; border-radius: 6px; transition: color 0.15s; line-height: 1; }
.nav-cog:hover { color: #a855f7; }

.page { max-width: 900px; margin: 0 auto; padding: 48px 20px 80px; }

.page-header { margin-bottom: 36px; }
.page-header h1 { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
.page-header p { color: #7c3aed; font-size: 14px; margin-top: 6px; }

.section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: #2a4070; margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid #1a0a40;
}

.prompt-card {
    background: #130929; border: 1px solid #1e0840; border-radius: 14px;
    padding: 36px; text-align: center; margin-bottom: 32px;
}
.prompt-card h2 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.prompt-card p { font-size: 14px; color: #7c3aed; margin-bottom: 20px; line-height: 1.6; }
.prompt-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none;
    transition: opacity 0.15s, transform 0.1s;
}
.prompt-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.prompt-btn-discord { background: #5865f2; color: #fff; }
.prompt-btn-green { background: #059669; color: #fff; }

.gamertag-form { display: flex; gap: 10px; max-width: 360px; margin: 0 auto; }
.gamertag-input {
    flex: 1; background: #060d1a; border: 1px solid #1a2e4a; border-radius: 8px;
    color: #e0e6f0; padding: 11px 14px; font-size: 14px; outline: none;
    transition: border-color 0.15s; font-family: inherit;
}
.gamertag-input:focus { border-color: #7c3aed; }
.gamertag-input::placeholder { color: #1e3060; }

.kits-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }

.kit-card {
    background: #130929; border: 1px solid #1e0840; border-radius: 12px;
    padding: 20px 24px; display: flex; align-items: center; gap: 20px;
    transition: border-color 0.15s;
}
.kit-card:hover { border-color: #3d1a70; }
.kit-card.unavailable { opacity: 0.6; }

.kit-info { flex: 1; min-width: 0; }
.kit-name { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.kit-desc { font-size: 13px; color: #5b21b6; line-height: 1.5; }
.kit-meta { font-size: 11px; color: #2d1060; margin-top: 6px; }
.kit-server { font-size: 12px; color: #4c1d95; margin-top: 3px; }

.kit-action { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.claim-btn {
    padding: 10px 22px; border-radius: 8px; border: none;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s; white-space: nowrap;
}
.claim-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
.claim-btn:disabled { cursor: not-allowed; opacity: 0.5; transform: none; }
.claim-btn-ready { background: #7c3aed; color: #fff; }
.claim-btn-cooldown { background: #1e0840; color: #5b21b6; }
.claim-btn-norole { background: #1e0840; color: #5b21b6; }

.claim-result { font-size: 12px; font-weight: 600; }
.claim-result.ok { color: #34d399; }
.claim-result.error { color: #f87171; }
.cooldown-timer { font-size: 11px; color: #4c1d95; }

.user-info-bar {
    background: #0c0520; border: 1px solid #1e0840; border-radius: 10px;
    padding: 14px 20px; margin-bottom: 24px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.user-info-bar .user-tag { font-size: 14px; color: #7c3aed; }
.user-info-bar .user-tag strong { color: #fff; }
.change-link { font-size: 12px; color: #4c1d95; cursor: pointer; text-decoration: underline; }
.change-link:hover { color: #7c3aed; }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <span class="nav-logo-text">SOLARIX</span>
  </a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/kits" class="active">Kits</a></li>
    <li><a href="/store.html">Store</a></li>
  </ul>
  <div class="nav-right">
    <a href="/admin-login.html" class="nav-cog" title="Admin">⚙</a>
    <div id="account-area">
      <a href="/auth/discord" style="background:#7c3aed;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;">Login with Discord</a>
    </div>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h1>Kits</h1>
    <p>Claim in-game kits directly from the website — link your gamertag first</p>
  </div>

  <div id="kits-container">
    <div class="prompt-card">
      <h2>Loading…</h2>
    </div>
  </div>
</div>

<script>
const state = { loggedIn: false, gamertag: null, kits: [] };

async function init() {
    const [userRes, kitsRes] = await Promise.all([fetch("/user"), fetch("/api/kits")]);
    const user = await userRes.json();
    const data = await kitsRes.json();
    state.loggedIn = user.loggedIn;
    state.gamertag = data.gamertag;
    state.kits = data.kits || [];
    render();
}

function render() {
    const el = document.getElementById("kits-container");

    // Update account area
    fetch("/user").then(r => r.json()).then(user => {
        if (user.loggedIn) {
            document.getElementById("account-area").innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;">
                    <img src="${user.avatar}" style="width:32px;height:32px;border-radius:50%;border:2px solid #7c3aed;">
                    <span style="color:#fff;font-size:14px;">${user.username}</span>
                    <a href="/logout" style="color:#f87171;font-size:13px;text-decoration:none;font-weight:700;">Logout</a>
                </div>`;
        }
    });

    if (!state.loggedIn) {
        el.innerHTML = `
            <div class="prompt-card">
                <h2>Login to Claim Kits</h2>
                <p>Connect your Discord account to claim in-game kits on Solarix.</p>
                <a href="/auth/discord" class="prompt-btn prompt-btn-discord">🔗 Login with Discord</a>
            </div>`;
        return;
    }

    if (!state.gamertag) {
        el.innerHTML = `
            <div class="prompt-card">
                <h2>Link Your In-Game Name</h2>
                <p>Enter your Rust Console gamertag so we can send kits to your character.<br>This only needs to be done once.</p>
                <div class="gamertag-form">
                    <input id="gt-input" class="gamertag-input" type="text" placeholder="Your gamertag" maxlength="50">
                    <button class="prompt-btn prompt-btn-green" onclick="linkGamertag()">Link</button>
                </div>
                <div id="gt-status" style="margin-top:10px;font-size:13px;"></div>
            </div>`;
        return;
    }

    const userBar = `
        <div class="user-info-bar">
            <span class="user-tag">In-game name: <strong>${escHtml(state.gamertag)}</strong></span>
            <span class="change-link" onclick="promptChangeGamertag()">Change</span>
        </div>`;

    if (!state.kits.length) {
        el.innerHTML = userBar + `<div class="prompt-card"><h2>No kits available yet.</h2><p>Check back soon!</p></div>`;
        return;
    }

    const kitsHtml = state.kits.map(k => {
        let btnClass = "claim-btn-ready";
        let btnText = "⬇ Claim Kit";
        let btnDisabled = "";
        let extra = "";

        if (!k.hasRole) {
            btnClass = "claim-btn-norole";
            btnText = "Role Required";
            btnDisabled = "disabled";
        } else if (k.onCooldown) {
            btnClass = "claim-btn-cooldown";
            btnText = "On Cooldown";
            btnDisabled = "disabled";
            if (k.expiresAt) {
                const ms = new Date(k.expiresAt) - Date.now();
                const mins = Math.ceil(ms / 60000);
                extra = `<div class="cooldown-timer">Available in ~${mins} min</div>`;
            }
        }

        const descHtml = k.description ? k.description.split("\n").map(l => `<div>${escHtml(l)}</div>`).join("") : "";

        return `
            <div class="kit-card ${(!k.hasRole || k.onCooldown) ? "unavailable" : ""}">
                <div class="kit-info">
                    <div class="kit-name">${escHtml(k.name)}</div>
                    <div class="kit-desc">${descHtml}</div>
                    <div class="kit-server">🖥️ ${escHtml(k.serverName || "Server")}</div>
                    <div class="kit-meta">⏱ ${k.cooldownMinutes}min cooldown${k.requiredRoleId ? " · Role required" : ""}</div>
                </div>
                <div class="kit-action">
                    <button id="btn-${k.id}" class="claim-btn ${btnClass}" ${btnDisabled} onclick="claimKit(${k.id})">
                        ${btnText}
                    </button>
                    <div id="res-${k.id}" class="claim-result"></div>
                    ${extra}
                </div>
            </div>`;
    }).join("");

    el.innerHTML = userBar + `<div class="kits-grid">${kitsHtml}</div>`;
}

function escHtml(str) {
    return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function claimKit(kitId) {
    const btn = document.getElementById(`btn-${kitId}`);
    const res = document.getElementById(`res-${kitId}`);
    if (btn) { btn.disabled = true; btn.textContent = "Claiming…"; }
    try {
        const r = await fetch("/api/kits/claim", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ kitId })
        });
        const data = await r.json();
        if (r.ok) {
            if (res) { res.textContent = "✓ Kit sent!"; res.className = "claim-result ok"; }
            // Update cooldown state
            const kit = state.kits.find(k => k.id === kitId);
            if (kit) { kit.onCooldown = true; kit.expiresAt = data.expiresAt; }
            setTimeout(() => { render(); }, 1500);
        } else {
            if (res) { res.textContent = `✗ ${data.error}`; res.className = "claim-result error"; }
            if (btn) { btn.disabled = false; btn.textContent = "⬇ Claim Kit"; }
        }
    } catch {
        if (res) { res.textContent = "✗ Network error."; res.className = "claim-result error"; }
        if (btn) { btn.disabled = false; btn.textContent = "⬇ Claim Kit"; }
    }
    setTimeout(() => { if (res) res.textContent = ""; }, 5000);
}

async function linkGamertag() {
    const input = document.getElementById("gt-input");
    const statusEl = document.getElementById("gt-status");
    const gamertag = input?.value?.trim();
    if (!gamertag) { if (statusEl) statusEl.textContent = "Enter your in-game name."; return; }
    if (statusEl) { statusEl.style.color = "#7c3aed"; statusEl.textContent = "Linking…"; }
    try {
        const r = await fetch("/api/kits/gamertag", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ gamertag })
        });
        const data = await r.json();
        if (r.ok) {
            state.gamertag = gamertag;
            const kitsRes = await fetch("/api/kits");
            const kitsData = await kitsRes.json();
            state.kits = kitsData.kits || [];
            render();
        } else {
            if (statusEl) { statusEl.style.color = "#f87171"; statusEl.textContent = `✗ ${data.error}`; }
        }
    } catch {
        if (statusEl) { statusEl.style.color = "#f87171"; statusEl.textContent = "✗ Network error."; }
    }
}

function promptChangeGamertag() {
    const newName = prompt(`Change in-game name (current: ${state.gamertag}):`, state.gamertag);
    if (!newName || !newName.trim()) return;
    fetch("/api/kits/gamertag", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ gamertag: newName.trim() })
    }).then(r => r.json()).then(data => {
        if (data.ok) { state.gamertag = newName.trim(); render(); }
        else alert("Failed: " + data.error);
    });
}

init();
</script>
</body>
</html>
