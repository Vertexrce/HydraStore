<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kits — Hydra</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0420; color: #e0e6f0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }

nav {
  background: rgba(8,4,20,0.97); border-bottom: 1px solid #1e0a40;
  padding: 0 40px; height: 62px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(10px);
}
.nav-logo-text { font-size: 18px; font-weight: 900; color: #a855f7; letter-spacing: 3px; text-shadow: 0 0 12px rgba(168,85,247,0.4); text-decoration: none; }
.nav-links { display: flex; gap: 4px; align-items: center; list-style: none; }
.nav-links a { color: #9a71d4; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 6px; transition: color 0.15s, background 0.15s; }
.nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }
.nav-links a.active { color: #a855f7; }
.nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.nav-btn { background: #7c3aed; color: #fff; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; transition: opacity 0.15s; }
.nav-btn:hover { opacity: 0.85; }
.nav-cog { color: #4a2080; text-decoration: none; font-size: 18px; padding: 6px 8px; border-radius: 6px; transition: color 0.15s; }
.nav-cog:hover { color: #a855f7; }

.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
.hamburger span { display: block; width: 24px; height: 2px; background: #a855f7; border-radius: 2px; transition: all 0.25s; }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu {
  display: none; position: fixed; top: 62px; left: 0; right: 0;
  background: rgba(10,4,32,0.98); backdrop-filter: blur(12px);
  border-bottom: 1px solid #1e0a40; z-index: 99;
  flex-direction: column; padding: 16px 20px 20px; gap: 4px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a { color: #c4b5fd; text-decoration: none; font-size: 15px; font-weight: 600; padding: 12px 14px; border-radius: 8px; transition: background 0.15s, color 0.15s; }
.mobile-menu a:hover { background: rgba(124,58,237,0.12); color: #fff; }

.page { max-width: 820px; margin: 0 auto; padding: 48px 20px 80px; }
.page-header { margin-bottom: 32px; }
.page-header h1 { font-size: 30px; font-weight: 800; color: #fff; }
.page-header p { color: #7c3aed; font-size: 14px; margin-top: 5px; }

.alert-card {
  border-radius: 12px; padding: 18px 22px;
  margin-bottom: 24px; display: flex; align-items: flex-start; gap: 14px;
  font-size: 13px; line-height: 1.6;
}
.alert-card.info { background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.25); color: #c4b5fd; }
.alert-card.warn { background: rgba(234,179,8,0.06); border: 1px solid rgba(234,179,8,0.2); color: #fcd34d; }
.alert-icon { font-size: 20px; flex-shrink: 0; }

.link-req-card {
  background: #130929; border: 1px solid #1e0840; border-radius: 14px;
  padding: 28px 24px; margin-bottom: 28px;
}
.link-req-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.link-req-sub { font-size: 13px; color: #7c3aed; margin-bottom: 20px; line-height: 1.6; }
.link-status-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.link-status-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: 20px;
  font-size: 12px; font-weight: 700; border: 1px solid;
}
.link-status-pill.ok { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.3); color: #22c55e; }
.link-status-pill.no { background: rgba(239,68,68,0.07); border-color: rgba(239,68,68,0.25); color: #f87171; }
.link-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.gamertag-row { display: flex; gap: 10px; max-width: 380px; }
.gt-input {
  flex: 1; background: #060d1a; border: 1px solid #1a2e4a; border-radius: 9px;
  color: #e0e6f0; padding: 11px 14px; font-size: 14px; outline: none;
  transition: border-color 0.15s; font-family: inherit;
}
.gt-input:focus { border-color: #7c3aed; }
.gt-input::placeholder { color: #1e3060; }
.gt-btn {
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: #fff; border: none; border-radius: 9px;
  padding: 11px 20px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: opacity 0.15s;
}
.gt-btn:hover { opacity: 0.88; }
.gt-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.gt-status-msg { font-size: 12px; margin-top: 8px; min-height: 18px; }
.gt-status-msg.ok { color: #34d399; }
.gt-status-msg.err { color: #f87171; }

.section-hd {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: #2a4070; margin-bottom: 14px; padding-bottom: 12px;
  border-bottom: 1px solid #1a0a40;
}
.kits-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }

.kit-card {
  background: #130929; border: 1px solid #1e0840; border-radius: 12px;
  padding: 18px 22px; display: flex; align-items: center; gap: 18px;
  transition: border-color 0.15s;
}
.kit-card:hover { border-color: #3d1a70; }
.kit-card.on-cooldown { border-color: rgba(234,179,8,0.2); background: rgba(234,179,8,0.02); }
.kit-icon { font-size: 28px; flex-shrink: 0; width: 44px; text-align: center; }
.kit-info { flex: 1; min-width: 0; }
.kit-name { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 3px; }
.kit-desc { font-size: 12px; color: #5b21b6; line-height: 1.5; }
.kit-meta { font-size: 11px; color: #2d1060; margin-top: 5px; display: flex; gap: 14px; }
.kit-server-tag {
  font-size: 10px; font-weight: 700; color: #7c3aed;
  background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2);
  border-radius: 4px; padding: 2px 7px;
}
.kit-actions { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.claim-btn {
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: #fff; border: none; border-radius: 9px;
  padding: 11px 22px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
.claim-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
.claim-btn:disabled { opacity: 0.45; cursor: not-allowed; background: #2d1060; transform: none; }
.claim-btn.cooldown { background: rgba(234,179,8,0.15); color: #fcd34d; font-size: 11px; }
.claim-result { font-size: 11px; text-align: right; min-height: 14px; }
.claim-result.ok { color: #34d399; }
.claim-result.err { color: #f87171; }

.empty-kits { text-align: center; padding: 48px 0; color: #2d1060; font-size: 14px; }

.prompt-card {
  background: #130929; border: 1px solid #1e0840; border-radius: 14px;
  padding: 32px; text-align: center; margin-bottom: 28px;
}
.prompt-card h2 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.prompt-card p { font-size: 13px; color: #7c3aed; margin-bottom: 20px; line-height: 1.6; }
.prompt-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px; border-radius: 8px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer;
  text-decoration: none; transition: opacity 0.15s;
  background: #5865f2; color: #fff;
}
.prompt-btn:hover { opacity: 0.88; }

@media (max-width: 680px) {
  nav { padding: 0 16px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .kit-card { flex-direction: column; align-items: flex-start; gap: 12px; }
  .kit-actions { width: 100%; flex-direction: row; align-items: center; justify-content: space-between; }
  .claim-btn { width: 100%; text-align: center; }
  .gamertag-row { flex-direction: column; max-width: 100%; }
  .gt-btn { width: 100%; }
  .link-status-row { flex-direction: column; }
}
</style>
<link rel="stylesheet" href="/hydra-theme.css">
</head>
<body>

<nav>
  <a href="/" class="nav-logo-text">HYDRA</a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/clans">Clans</a></li>
    <li><a href="/kits" class="active">Kits</a></li>
    <li><a href="/gems">💎 Gems</a></li>
    <li><a href="/store.html">Store</a></li>
  </ul>
  <div class="nav-right">
    <a href="https://discord.gg/playsolarix" class="nav-btn nav-discord-server" target="_blank">Discord</a>
    <a href="/admin-login.html" class="nav-cog" title="Admin">⚙</a>
    <div id="account-area"><a href="/auth/discord" class="nav-btn">Login</a></div>
  </div>
  <div class="hamburger" id="hamburger" onclick="this.classList.toggle('open');document.getElementById('mobile-menu').classList.toggle('open');">
    <span></span><span></span><span></span>
  </div>
</nav>
<div class="mobile-menu" id="mobile-menu">
  <a href="/">Home</a><a href="/clans">Clans</a>
  <a href="/kits">Kits</a><a href="/gems">💎 Gems</a><a href="/store.html">Store</a>
  <div id="mob-account"></div>
</div>

<div class="page">
  <div class="page-header">
    <h1>🎒 Kits</h1>
    <p>Claim kits directly on the game server. Cooldowns reset after each wipe.</p>
  </div>
  <div id="page-body">
    <div style="text-align:center;padding:60px 0;color:#5b21b6;font-size:14px;">Loading…</div>
  </div>
</div>

<script>
const state = { loggedIn: false, gamertag: null, kits: [], timers: {} };

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function init() {
  const [userRes, kitsRes] = await Promise.all([fetch("/user"), fetch("/api/kits")]);
  const user = await userRes.json();
  const data = await kitsRes.json();

  if (user.loggedIn) {
    document.getElementById("account-area").innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="${esc(user.avatar)}" style="width:30px;height:30px;border-radius:50%;border:2px solid #7c3aed;" alt="">
        <span style="font-size:13px;color:#e0e6f0;font-weight:600;">${esc(user.username)}</span>
        <a href="/logout" style="color:#f87171;font-size:13px;font-weight:600;text-decoration:none;">Logout</a>
      </div>`;
    document.getElementById("mob-account").innerHTML =
      `<a href="/logout" style="color:#f87171">Logout</a>`;
  }

  state.loggedIn = data.loggedIn;
  state.gamertag = data.gamertag || null;
  state.kits = data.kits || [];
  render();
}

function render() {
  const body = document.getElementById("page-body");

  if (!state.loggedIn) {
    body.innerHTML = `
      <div class="prompt-card">
        <h2>🎮 Login to Claim Kits</h2>
        <p>Log in with Discord to access your kit claims. Kits are sent directly to you in-game.</p>
        <a href="/auth/discord" class="prompt-btn">🔐 Login with Discord</a>
      </div>`;
    return;
  }

  const linked = !!state.gamertag;

  let linkSection = `
    <div class="link-req-card">
      <div class="link-req-title">🔗 Account Link Status</div>
      <div class="link-req-sub">Link your in-game name to claim kits. You can also use <code style="color:#a855f7">/link</code> in Discord.</div>
      <div class="link-status-row">
        <div class="link-status-pill ${linked ? "ok" : "no"}">
          <span class="link-dot"></span>
          In-game Name: ${linked ? esc(state.gamertag) : "Not linked"}
        </div>
      </div>`;

  if (!linked) {
    linkSection += `
      <div class="gamertag-row">
        <input type="text" class="gt-input" id="gt-input" placeholder="Your exact in-game name…">
        <button class="gt-btn" id="gt-btn" onclick="saveGamertag()">Link</button>
      </div>
      <div class="gt-status-msg" id="gt-status"></div>`;
  } else {
    linkSection += `
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div class="gamertag-row" style="max-width:320px;margin:0;">
          <input type="text" class="gt-input" id="gt-input" value="${esc(state.gamertag)}" placeholder="Update in-game name…">
          <button class="gt-btn" id="gt-btn" onclick="saveGamertag()">Update</button>
        </div>
      </div>
      <div class="gt-status-msg" id="gt-status"></div>`;
  }

  linkSection += `</div>`;

  if (!linked) {
    linkSection += `
      <div class="alert-card warn">
        <span class="alert-icon">⚠️</span>
        <div>
          <strong>Link required to claim kits.</strong>
          Enter your exact in-game name above to get started.
          You can also run <code style="color:#fcd34d">/link</code> in our
          <a href="https://discord.gg/playsolarix" target="_blank" style="color:#fcd34d">Discord</a> and it will sync automatically.
        </div>
      </div>`;
  }

  let kitsHtml = "";
  if (!state.kits.length) {
    kitsHtml = `<div class="empty-kits">No kits configured yet. Check back soon!</div>`;
  } else {
    kitsHtml = `<div class="kits-grid">${state.kits.map(kit => buildKitCard(kit)).join("")}</div>`;
  }

  body.innerHTML = linkSection + `
    <div class="section-hd">🎒 Available Kits</div>
    ${kitsHtml}`;

  state.kits.forEach(kit => {
    if (kit.onCooldown && kit.expiresAt) startCooldownTimer(kit.id, kit.expiresAt);
  });
}

function buildKitCard(kit) {
  const icons = { starter: "🎁", vip: "⭐", ak: "🔫", builder: "🔨", medic: "💊", food: "🥩", weapons: "⚔️", tools: "🔧" };
  const iconKey = Object.keys(icons).find(k => kit.name.toLowerCase().includes(k));
  const icon = iconKey ? icons[iconKey] : "📦";

  let btnHtml;
  let cardClass = "kit-card";
  let statusBadge = "";

  if (!kit.enabled) {
    // Kit is disabled by admin
    cardClass += " on-cooldown";
    btnHtml = `<button class="claim-btn" disabled style="background:#4b1c1c;color:#f87171;cursor:not-allowed;">⛔ Disabled</button>`;
    statusBadge = `<span style="display:inline-block;background:#7f1d1d22;border:1px solid #991b1b;color:#f87171;font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;margin-left:6px;">DISABLED</span>`;
  } else if (kit.onCooldown) {
    cardClass += " on-cooldown";
    const timeLeft = kit.expiresAt ? Math.max(0, new Date(kit.expiresAt) - Date.now()) : 0;
    btnHtml = `<button class="claim-btn cooldown" disabled id="claim-btn-${kit.id}">⏳ ${formatMs(timeLeft)}</button>`;
  } else {
    btnHtml = `<button class="claim-btn" id="claim-btn-${kit.id}" onclick="claimKit(${kit.id})" ${!state.gamertag ? "disabled title='Link your in-game name first'" : ""}>
      ⬇ Claim Kit
    </button>`;
  }

  return `
    <div class="${cardClass}" id="kit-card-${kit.id}">
      <div class="kit-icon">${icon}</div>
      <div class="kit-info">
        <div class="kit-name">${esc(kit.name)}${statusBadge}</div>
        ${kit.description ? `<div class="kit-desc">${esc(kit.description)}</div>` : ""}
        <div class="kit-meta">
          ${kit.enabled ? `<span>⏱ ${kit.cooldownMinutes}min cooldown</span>` : ""}
          <span class="kit-server-tag">${esc(kit.serverName)}</span>
          ${kit.givenBy === "admin" ? `<span style="font-size:11px;color:#4c1d95;">Admin gift</span>` : ""}
        </div>
      </div>
      <div class="kit-actions">
        ${btnHtml}
        <div class="claim-result" id="claim-result-${kit.id}"></div>
      </div>
    </div>`;
}

function formatMs(ms) {
  const totalS = Math.ceil(ms / 1000);
  const h = Math.floor(totalS / 3600);
  const m = Math.floor((totalS % 3600) / 60);
  const s = totalS % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function startCooldownTimer(kitId, expiresAt) {
  if (state.timers[kitId]) clearInterval(state.timers[kitId]);
  const expTime = new Date(expiresAt).getTime();
  state.timers[kitId] = setInterval(() => {
    const left = expTime - Date.now();
    const btn = document.getElementById(`claim-btn-${kitId}`);
    if (left <= 0) {
      clearInterval(state.timers[kitId]);
      if (btn) { btn.className = "claim-btn"; btn.disabled = !state.gamertag; btn.textContent = "⬇ Claim Kit"; btn.onclick = () => claimKit(kitId); }
      const card = document.getElementById(`kit-card-${kitId}`);
      if (card) card.classList.remove("on-cooldown");
    } else {
      if (btn) btn.textContent = `⏳ ${formatMs(left)}`;
    }
  }, 1000);
}

async function claimKit(kitId) {
  const btn = document.getElementById(`claim-btn-${kitId}`);
  const res = document.getElementById(`claim-result-${kitId}`);
  if (btn) { btn.disabled = true; btn.textContent = "Claiming…"; }
  if (res) res.textContent = "";
  try {
    const r = await fetch("/api/kits/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kitId })
    });
    const data = await r.json();
    if (r.ok && data.ok) {
      if (res) { res.textContent = "✅ Kit sent!"; res.className = "claim-result ok"; }
      if (btn) { btn.className = "claim-btn cooldown"; btn.disabled = true; btn.textContent = "⏳ Starting…"; }
      if (data.expiresAt) startCooldownTimer(kitId, data.expiresAt);
      const card = document.getElementById(`kit-card-${kitId}`);
      if (card) card.classList.add("on-cooldown");
    } else {
      if (res) { res.textContent = `✗ ${data.error || "Failed"}`; res.className = "claim-result err"; }
      if (btn) { btn.disabled = false; btn.textContent = "⬇ Claim Kit"; }
    }
  } catch {
    if (res) { res.textContent = "✗ Network error."; res.className = "claim-result err"; }
    if (btn) { btn.disabled = false; btn.textContent = "⬇ Claim Kit"; }
  }
  setTimeout(() => { if (res) res.textContent = ""; }, 5000);
}

async function saveGamertag() {
  const input = document.getElementById("gt-input");
  const statusEl = document.getElementById("gt-status");
  const btn = document.getElementById("gt-btn");
  const gt = input?.value?.trim();
  if (!gt) { if (statusEl) { statusEl.textContent = "Enter your in-game name."; statusEl.className = "gt-status-msg err"; } return; }
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const r = await fetch("/api/kits/gamertag", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ gamertag: gt })
    });
    const data = await r.json();
    if (r.ok) {
      state.gamertag = gt;
      if (statusEl) { statusEl.textContent = "✅ In-game name saved!"; statusEl.className = "gt-status-msg ok"; }
      setTimeout(() => { render(); init(); }, 1000);
    } else {
      if (statusEl) { statusEl.textContent = `✗ ${data.error}`; statusEl.className = "gt-status-msg err"; }
    }
  } catch {
    if (statusEl) { statusEl.textContent = "✗ Network error."; statusEl.className = "gt-status-msg err"; }
  }
  if (btn) { btn.disabled = false; btn.textContent = state.gamertag ? "Update" : "Link"; }
}

init();
</script>
</body>
</html>
