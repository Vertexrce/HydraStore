<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Account — Hydra</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0420; color: #e0e6f0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }

nav {
  background: rgba(8,4,20,0.97); border-bottom: 1px solid #1e0a40;
  padding: 0 40px; height: 62px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(10px);
}
.nav-logo-text { font-size: 18px; font-weight: 900; color: #a855f7; letter-spacing: 3px; text-shadow: 0 0 12px rgba(168,85,247,0.4); text-decoration: none; }
.nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
@media (max-width: 768px) { .nav-right .nav-discord-server { display: none; } }
.nav-btn { background: #7c3aed; color: #fff; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; transition: opacity 0.15s; }
.nav-btn:hover { opacity: 0.85; }
.nav-links { display: flex; gap: 4px; list-style: none; }
.nav-links a { color: #9a71d4; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 6px; transition: color 0.15s, background 0.15s; }
.nav-links a:hover, .nav-links a.active { color: #fff; background: rgba(255,255,255,0.05); }
.nav-links a.active { color: #a855f7; }

/* ── Hamburger ── */
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
.hamburger span { display: block; width: 24px; height: 2px; background: #a855f7; border-radius: 2px; transition: all 0.25s; }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu {
  display: none; position: fixed; top: 62px; left: 0; right: 0;
  background: rgba(10,4,32,0.98); backdrop-filter: blur(12px);
  border-bottom: 1px solid #1e0a40; z-index: 99;
  flex-direction: column; padding: 16px 20px 20px; gap: 4px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a { color: #c4b5fd; text-decoration: none; font-size: 15px; font-weight: 600; padding: 12px 14px; border-radius: 8px; }

.page { max-width: 640px; margin: 0 auto; padding: 52px 20px 80px; }

.page-title { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 6px; }
.page-sub { font-size: 14px; color: #7c3aed; margin-bottom: 36px; }

/* ── Status cards ── */
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 32px; }
.status-card {
  background: #130929;
  border: 1px solid #1e0840;
  border-radius: 14px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.status-card.linked { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.04); }
.status-card.unlinked { border-color: rgba(239,68,68,0.25); }
.status-card-icon { font-size: 24px; margin-bottom: 8px; }
.status-card-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #5b21b6; margin-bottom: 6px; }
.status-card-value { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; word-break: break-all; }
.status-card-sub { font-size: 12px; color: #5b21b6; }
.status-badge {
  position: absolute; top: 14px; right: 14px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  padding: 3px 9px; border-radius: 20px;
}
.status-badge.ok { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
.status-badge.no { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }

/* ── Form card ── */
.form-card {
  background: #130929;
  border: 1px solid #1e0840;
  border-radius: 14px;
  padding: 28px;
  margin-bottom: 20px;
}
.form-card h2 { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.form-card p { font-size: 13px; color: #7c3aed; margin-bottom: 20px; line-height: 1.6; }
.input-row { display: flex; gap: 10px; }
.gt-input {
  flex: 1;
  background: #060d1a;
  border: 1px solid #1a2e4a;
  border-radius: 9px;
  color: #e0e6f0;
  padding: 12px 16px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.gt-input:focus { border-color: #7c3aed; }
.gt-input::placeholder { color: #1e3060; }
.gt-btn {
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: #fff;
  border: none;
  border-radius: 9px;
  padding: 12px 22px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
.gt-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.gt-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.gt-status { font-size: 13px; margin-top: 10px; min-height: 20px; }
.gt-status.ok { color: #34d399; }
.gt-status.err { color: #f87171; }

/* ── Discord steps ── */
.steps-card {
  background: #130929;
  border: 1px solid #1e0840;
  border-radius: 14px;
  padding: 28px;
  margin-bottom: 20px;
}
.steps-card h2 { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 16px; }
.step { display: flex; gap: 16px; margin-bottom: 16px; align-items: flex-start; }
.step:last-child { margin-bottom: 0; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(124,58,237,0.15);
  border: 1px solid rgba(124,58,237,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #a855f7;
  flex-shrink: 0; margin-top: 1px;
}
.step-content { flex: 1; }
.step-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 3px; }
.step-desc { font-size: 12px; color: #7c3aed; line-height: 1.5; }
.step-code {
  display: inline-block;
  background: #060d1a;
  border: 1px solid #2d1060;
  border-radius: 6px;
  padding: 5px 12px;
  font-family: 'Courier New', monospace;
  font-size: 13px; font-weight: 700;
  color: #a855f7;
  margin-top: 6px;
}

.info-note {
  background: rgba(124,58,237,0.06);
  border: 1px solid rgba(124,58,237,0.2);
  border-radius: 10px;
  padding: 14px 18px;
  font-size: 13px;
  color: #9a71d4;
  line-height: 1.6;
}

.login-wall {
  background: #130929; border: 1px solid #1e0840; border-radius: 14px;
  padding: 48px 32px; text-align: center;
}
.login-wall h2 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 10px; }
.login-wall p { font-size: 14px; color: #7c3aed; margin-bottom: 24px; line-height: 1.6; }
.discord-login-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: #5865f2; color: #fff;
  border: none; border-radius: 10px;
  padding: 14px 32px; font-size: 15px; font-weight: 700;
  cursor: pointer; text-decoration: none;
  transition: opacity 0.15s;
}
.discord-login-btn:hover { opacity: 0.88; }

@media (max-width: 600px) {
  nav { padding: 0 16px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .status-grid { grid-template-columns: 1fr; }
  .input-row { flex-direction: column; }
  .gt-btn { width: 100%; }
}
</style>
<link rel="stylesheet" href="/hydra-theme.css">
</head>
<body>

<nav>
  <a href="/" class="nav-logo-text">HYDRA</a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/clans">Clans</a></li>
    <li><a href="/kits">Kits</a></li>
    <li><a href="/store.html">Store</a></li>
    <li><a href="/link" class="active">Link</a></li>
  </ul>
  <div class="nav-right">
    <a href="https://discord.gg/D8XSz4USNm" class="nav-btn nav-discord-server" target="_blank">Discord</a>
    <div id="account-area"><a href="/auth/discord" class="nav-btn">Login</a></div>
  </div>
  <div class="hamburger" id="hamburger" onclick="this.classList.toggle('open');document.getElementById('mobile-menu').classList.toggle('open');">
    <span></span><span></span><span></span>
  </div>
</nav>
<div class="mobile-menu" id="mobile-menu">
  <a href="/">Home</a><a href="/clans">Clans</a><a href="/kits">Kits</a>
  <a href="/store.html">Store</a><a href="/link">Link Account</a>
  <div id="mob-account"></div>
</div>

<div class="page">
  <div class="page-title">🔗 Link Account</div>
  <div class="page-sub">Connect your Discord and in-game name to claim kits on the website.</div>

  <div id="page-body">
    <div style="text-align:center;padding:60px 0;color:#5b21b6;font-size:14px;">Loading…</div>
  </div>
</div>

<script>
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function init() {
  const [userRes, linkRes] = await Promise.all([fetch("/user"), fetch("/api/link-status")]);
  const user = await userRes.json();
  const link = await linkRes.json();

  // Nav account
  if (user.loggedIn) {
    document.getElementById("account-area").innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="${esc(user.avatar)}" style="width:30px;height:30px;border-radius:50%;border:2px solid #7c3aed;" alt="">
        <span style="font-size:13px;color:#e0e6f0;font-weight:600;">${esc(user.username)}</span>
        <a href="/logout" style="color:#f87171;font-size:13px;font-weight:600;text-decoration:none;">Logout</a>
      </div>`;
    document.getElementById("mob-account").innerHTML =
      `<a href="/logout" style="color:#f87171">Logout</a>`;
  }

  if (!user.loggedIn) {
    renderLoginWall();
    return;
  }

  renderLinked(link);
}

function renderLoginWall() {
  document.getElementById("page-body").innerHTML = `
    <div class="login-wall">
      <h2>Login Required</h2>
      <p>You need to log in with Discord before linking your in-game account.<br>
         This lets us connect your Discord identity to your gamertag.</p>
      <a href="/auth/discord" class="discord-login-btn">
        <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
        Login with Discord
      </a>
    </div>`;
}

function renderLinked(link) {
  const webOk = link.webLinked;
  const botOk = link.botLinked;

  document.getElementById("page-body").innerHTML = `
    <div class="status-grid">
      <div class="status-card${webOk ? " linked" : " unlinked"}">
        <span class="status-badge ${webOk ? "ok" : "no"}">${webOk ? "✓ Linked" : "✗ Not Linked"}</span>
        <div class="status-card-icon">${webOk ? "🌐" : "🌐"}</div>
        <div class="status-card-label">Web Link</div>
        <div class="status-card-value">${webOk ? esc(link.webGamertag) : "—"}</div>
        <div class="status-card-sub">${webOk ? "Linked via this website" : "Link below"}</div>
      </div>
      <div class="status-card${botOk ? " linked" : " unlinked"}">
        <span class="status-badge ${botOk ? "ok" : "no"}">${botOk ? "✓ Linked" : "✗ Not Linked"}</span>
        <div class="status-card-icon">🤖</div>
        <div class="status-card-label">Discord Bot Link</div>
        <div class="status-card-value">${botOk ? esc(link.botGamertag) : "—"}</div>
        <div class="status-card-sub">${botOk ? "Linked via /link in Discord" : "Use /link in Discord"}</div>
      </div>
    </div>

    ${(!webOk || !botOk) ? `
    <div class="info-note" style="margin-bottom:20px;">
      ⚠️ <strong>Both links required</strong> — You need to link your gamertag on this website <em>and</em> in Discord using the bot's <code style="color:#a855f7">/link</code> command before you can claim kits.
    </div>` : `
    <div class="info-note" style="margin-bottom:20px;border-color:rgba(34,197,94,0.3);color:#34d399;">
      ✅ <strong>Fully linked!</strong> You can now claim kits on the <a href="/kits" style="color:#a855f7;font-weight:700;">Kits page</a>.
    </div>`}

    <div class="form-card">
      <h2>🎮 Link In-Game Name (Web)</h2>
      <p>Enter your exact in-game gamertag. This must match what appears in-game so the kit command can find you on the server.</p>
      <div class="input-row">
        <input type="text" class="gt-input" id="gt-input" placeholder="Your in-game gamertag…" value="${webOk ? esc(link.webGamertag) : ""}">
        <button class="gt-btn" id="gt-btn" onclick="saveGamertag()">
          ${webOk ? "Update" : "Save & Link"}
        </button>
      </div>
      <div class="gt-status" id="gt-status"></div>
    </div>

    <div class="steps-card">
      <h2>🤖 Link in Discord (Bot)</h2>
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-content">
          <div class="step-title">Join the Hydra Discord</div>
          <div class="step-desc">If you haven't already, join our Discord server.</div>
          <a href="https://discord.gg/D8XSz4USNm" target="_blank" class="step-code">discord.gg/D8XSz4USNm</a>
        </div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-content">
          <div class="step-title">Use the /link command</div>
          <div class="step-desc">In any bot channel, type the link command with your gamertag and select your server.</div>
          <div class="step-code">/link [server] [gamertag]</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-content">
          <div class="step-title">Confirm the link</div>
          <div class="step-desc">The bot will confirm your gamertag is linked. Once done, both links above will show as ✓ Linked and you can claim kits here.</div>
        </div>
      </div>
    </div>
  `;
}

async function saveGamertag() {
  const input = document.getElementById("gt-input");
  const status = document.getElementById("gt-status");
  const btn = document.getElementById("gt-btn");
  const gt = input?.value?.trim();
  if (!gt) { status.textContent = "Enter your gamertag first."; status.className = "gt-status err"; return; }
  btn.disabled = true; btn.textContent = "Saving…";
  status.textContent = "";
  try {
    const r = await fetch("/api/kits/gamertag", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ gamertag: gt })
    });
    const data = await r.json();
    if (r.ok) {
      status.textContent = "✅ Gamertag saved!";
      status.className = "gt-status ok";
      btn.textContent = "Update";
      // Reload page to refresh link status
      setTimeout(() => location.reload(), 1200);
    } else {
      status.textContent = `✗ ${data.error || "Failed."}`;
      status.className = "gt-status err";
    }
  } catch {
    status.textContent = "✗ Network error.";
    status.className = "gt-status err";
  }
  btn.disabled = false;
}

init();
</script>
</body>
</html>
