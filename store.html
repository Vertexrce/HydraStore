<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vestige 6X Store</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.admin-cog-btn {
    font-size: 22px;
    color: #6b21a8;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 8px;
    transition: color 0.2s, background 0.2s;
    line-height: 1;
}
.admin-cog-btn:hover { color: #a855f7; background: rgba(124,58,237,0.12); }

.nav-right { display: flex; align-items: center; gap: 6px; }
.cart-icon-btn {
    position: relative;
    color: #9a71d4;
    text-decoration: none;
    font-size: 20px;
    padding: 6px 10px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
    line-height: 1;
}
.cart-icon-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
.cart-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #7c3aed;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    display: none;
    align-items: center;
    justify-content: center;
}

/* ── Category tabs ── */
.category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
.category-tab {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid #2d1060;
    background: transparent;
    color: #8b5cf6;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
}
.category-tab:hover { border-color: #5b21b6; color: #7aa0d4; background: rgba(77,141,255,0.05); }
.category-tab.active { background: #4c1d95; border-color: #7c3aed; color: #fff; }

/* ── Category section ── */
.category-section { margin-bottom: 48px; }
.category-section.hidden { display: none; }
.category-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5b21b6;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #1a0a40;
}

/* ── Store grid ── */
.store-grid-inner { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

.store-card-v2 {
    background: #130929;
    border: 1px solid #1e0840;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s, transform 0.15s;
}
.store-card-v2:hover { border-color: #5b21b6; transform: translateY(-2px); }

.store-card-img { width: 100%; height: 160px; object-fit: cover; display: block; background: #0c0520; }
.store-card-img.hidden { display: none; }
.store-card-body { padding: 22px 24px; display: flex; flex-direction: column; flex: 1; }
.store-card-name { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; letter-spacing: -0.3px; }
.store-card-price { font-size: 26px; font-weight: 800; color: #a855f7; margin-bottom: 14px; letter-spacing: -0.5px; }
.store-card-desc { font-size: 13px; color: #8b5cf6; line-height: 1.6; margin-bottom: 20px; flex: 1; }
.store-card-desc img { max-width: 100%; border-radius: 6px; margin-top: 8px; }

/* ── Buttons ── */
.card-btns { display: flex; flex-direction: column; gap: 10px; }

.store-buy-btn {
    display: block;
    width: 100%;
    padding: 15px 0;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 4px 18px rgba(124,58,237,0.3);
}
.store-buy-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124,58,237,0.45); }
.store-buy-btn:active { transform: translateY(0); }

.store-cart-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    padding: 11px 0;
    background: transparent;
    color: #a855f7;
    border: 1px solid #4c1d95;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
}
.store-cart-btn:hover { background: rgba(124,58,237,0.1); border-color: #7c3aed; color: #7aa0d4; }
.store-cart-btn.added { color: #34d399; border-color: #4c1d95; background: rgba(5,150,105,0.08); }

/* ── Admin banner ── */
.admin-banner {
    display: none;
    background: #130929;
    border: 1px solid #7c3aed;
    border-radius: 10px;
    padding: 12px 20px;
    margin-bottom: 28px;
    color: #a855f7;
    font-size: 14px;
}

.store-page-v2 { max-width: 1100px; margin: 0 auto; padding: 48px 32px 80px; }
.store-page-v2 h1 { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 28px; letter-spacing: -0.5px; }

/* ── Toast ── */
.toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #120838;
    border: 1px solid #3b1464;
    color: #7aa0d4;
    font-size: 13px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 8px;
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 700px) {
    .store-page-v2 { padding: 28px 16px 60px; }
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <img src="vestige-logo.jpg" alt="Vestige 6X">
    </div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="store.html">Store</a></li>
        <li><a href="/kits">Kits</a></li>
    </ul>
    <div class="nav-right">
        <a href="/cart.html" class="cart-icon-btn" title="View Cart">
            🛒
            <span class="cart-badge" id="nav-cart-count"></span>
        </a>
        <a href="/admin-login.html" class="admin-cog-btn" title="Admin Setup">⚙</a>
    </div>
</nav>

<div class="store-page-v2">
    <h1>Vestige 6X Store</h1>

    <div class="admin-banner" id="admin-banner">
        ⚙️ <strong>Admin mode</strong> — Bypass Payment buttons appear on the checkout page for each item.
        <a href="/admin" style="color:#a855f7;margin-left:12px;">Go to Admin Panel →</a>
    </div>

    <div class="category-tabs" id="category-tabs">
        <button class="category-tab active" data-cat="all" onclick="filterCat('all', this)">All Items</button>
    </div>

    <div id="store-sections">
        <div style="color:#2a1060;padding:60px;text-align:center;">Loading…</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CART_KEY = "vestige6x_cart";

function getCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; } }
function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateNavBadge(); }

function updateNavBadge() {
    const cart = getCart();
    const badge = document.getElementById("nav-cart-count");
    if (cart.length > 0) {
        badge.textContent = cart.length;
        badge.style.display = "flex";
    } else {
        badge.style.display = "none";
    }
}

function addToCart(item) {
    const cart = getCart();
    if (cart.find(i => i.id === item.id)) {
        showToast("Already in cart! → View Cart");
        return;
    }
    cart.push(item);
    saveCart(cart);
    showToast(`✓ ${item.name} added to cart`);
    // Update button
    const btn = document.getElementById(`cart-btn-${item.id}`);
    if (btn) { btn.textContent = "✓ Added to Cart"; btn.classList.add("added"); btn.disabled = true; }
}

let toastTimer;
function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

function esc(str) {
    return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderDescription(desc) {
    if (!desc) return "";
    return desc.split("\n").filter(l => l.trim()).map(line => {
        if (line.trim().startsWith("[img:") && line.trim().endsWith("]")) {
            const url = line.trim().slice(5, -1).trim();
            return `<img src="${esc(url)}" alt="Item image" style="max-width:100%;border-radius:6px;margin-top:6px;display:block;" onerror="this.style.display='none'">`;
        }
        return `<span>${esc(line.trim())}</span>`;
    }).join("<br>");
}

function filterCat(cat, btn) {
    document.querySelectorAll(".category-tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".category-section").forEach(sec => {
        sec.classList.toggle("hidden", cat !== "all" && sec.dataset.cat !== cat);
    });
}

function renderSections(items) {
    const sectionsEl = document.getElementById("store-sections");
    const tabsEl = document.getElementById("category-tabs");
    const cart = getCart();
    const inCart = new Set(cart.map(i => i.id));

    const seen = new Set(), cats = [];
    for (const item of items) {
        const c = item.category || "General";
        if (!seen.has(c)) { seen.add(c); cats.push(c); }
    }
    const order = ["Ranks","Kits","Extras","General"];
    cats.sort((a,b) => { const ai = order.indexOf(a); const bi = order.indexOf(b); return (ai===-1?99:ai)-(bi===-1?99:bi); });

    tabsEl.innerHTML = `<button class="category-tab active" data-cat="all" onclick="filterCat('all', this)">All Items</button>`;
    cats.forEach(cat => {
        tabsEl.innerHTML += `<button class="category-tab" data-cat="${esc(cat)}" onclick="filterCat('${esc(cat)}', this)">${esc(cat)}</button>`;
    });

    if (!items.length) { sectionsEl.innerHTML = `<div style="color:#2a1060;text-align:center;padding:60px;">No items yet.</div>`; return; }

    let html = "";
    for (const cat of cats) {
        const catItems = items.filter(i => (i.category || "General") === cat);
        if (!catItems.length) continue;
        html += `<div class="category-section" data-cat="${esc(cat)}">
            <div class="category-title">${esc(cat)}</div>
            <div class="store-grid-inner">
                ${catItems.map(item => {
                    const already = inCart.has(item.id);
                    return `<div class="store-card-v2">
                        ${item.imageUrl ? `<img class="store-card-img" src="${esc(item.imageUrl)}" alt="${esc(item.name)}" onerror="this.classList.add('hidden')">` : ""}
                        <div class="store-card-body">
                            <div class="store-card-name">${esc(item.name)}</div>
                            <div class="store-card-price">${esc(item.price)}</div>
                            <div class="store-card-desc">${renderDescription(item.description)}</div>
                            <div class="card-btns">
                                <a href="/checkout/${item.id}" class="store-buy-btn">💳 Buy Now</a>
                                <button
                                    id="cart-btn-${item.id}"
                                    class="store-cart-btn ${already ? 'added' : ''}"
                                    onclick='addToCart(${JSON.stringify({id:item.id,name:item.name,price:item.price,imageUrl:item.imageUrl||"",category:item.category||""})})'
                                    ${already ? "disabled" : ""}
                                >${already ? "✓ Added to Cart" : "🛒 Add to Cart"}</button>
                            </div>
                        </div>
                    </div>`;
                }).join("")}
            </div>
        </div>`;
    }
    sectionsEl.innerHTML = html;
}

async function init() {
    updateNavBadge();
    const [statusRes, itemsRes] = await Promise.all([fetch("/api/admin-status"), fetch("/api/store-items")]);
    const { isAdmin } = await statusRes.json();
    const items = await itemsRes.json();
    if (isAdmin) document.getElementById("admin-banner").style.display = "block";
    renderSections(items);
}

init();
</script>

</body>
</html>
