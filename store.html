<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertex 6X Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <img src="vertex-logo.png" alt="Vertex 6X">
    </div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="store.html">Store</a></li>
    </ul>
    <a href="/admin-login.html" class="admin-cog-btn" title="Admin Setup">⚙</a>
</nav>

<section class="store-page">
    <h1>Vertex 6X Store</h1>
    <div id="admin-banner" style="display:none;background:#0c172b;border:1px solid #2563eb;border-radius:10px;padding:12px 20px;margin-bottom:24px;color:#4d8dff;font-size:14px;">
        ⚙️ <strong>Admin mode</strong> — Bypass Payment buttons appear on the checkout page for each item.
        <a href="/admin" style="color:#4d8dff;margin-left:12px;">Go to Admin Panel →</a>
    </div>
    <div class="store-grid" id="store-grid">
        <div class="store-card" style="opacity:0.5"><h3>Loading...</h3></div>
    </div>
</section>

<style>
.admin-cog-btn {
    font-size: 22px;
    color: #4a5a7a;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 8px;
    transition: color 0.2s, background 0.2s;
    line-height: 1;
}
.admin-cog-btn:hover {
    color: #4d8dff;
    background: rgba(37, 99, 235, 0.12);
}
</style>

<script>
async function init() {
    const [statusRes, itemsRes] = await Promise.all([
        fetch("/api/admin-status"),
        fetch("/api/store-items")
    ]);
    const { isAdmin } = await statusRes.json();
    const items = await itemsRes.json();

    if (isAdmin) document.getElementById("admin-banner").style.display = "block";

    const grid = document.getElementById("store-grid");
    if (!items || items.length === 0) {
        grid.innerHTML = '<p style="color:#8899bb;text-align:center;padding:40px">No items available yet.</p>';
        return;
    }

    grid.innerHTML = items.map(item => {
        const lines = (item.description || "").split("\n").filter(l => l.trim());
        const featuresHtml = lines.map(l => `<span>${l.trim()}</span>`).join("<br>");
        return `
            <div class="store-card">
                <h3>${item.name}</h3>
                <p>${featuresHtml}</p>
                <div class="price">${item.price}</div>
                <a href="/checkout/${item.id}"><button>Buy Now</button></a>
            </div>
        `;
    }).join("");
}

init().catch(() => {
    document.getElementById("store-grid").innerHTML =
        '<p style="color:#f87171;text-align:center;padding:40px">Failed to load store items.</p>';
});
</script>

</body>
</html>
