<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Hydra</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0420; color: #e0e6f0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }
nav { background: rgba(8,12,20,0.95); border-bottom: 1px solid #1e0a40; padding: 0 40px; height: 62px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
.nav-logo-text { font-size: 18px; font-weight: 900; color: #a855f7; letter-spacing: 3px; text-decoration: none; }
.nav-right { display: flex; align-items: center; gap: 10px; }

.page { max-width: 560px; margin: 0 auto; padding: 60px 24px 80px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: #5b21b6; font-size: 13px; text-decoration: none; margin-bottom: 32px; }
.back-link:hover { color: #a855f7; }

.item-summary { background: #130929; border: 1px solid #1e0840; border-radius: 14px; padding: 24px; margin-bottom: 28px; display: flex; gap: 18px; align-items: center; }
.item-summary-img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; background: #0c0520; flex-shrink: 0; }
.item-summary-img.hidden { display: none; }
.item-summary-name { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.item-summary-price { font-size: 28px; font-weight: 800; color: #a855f7; }

.pay-buttons { display: flex; flex-direction: column; gap: 12px; }
.pay-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 17px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; transition: opacity 0.15s, transform 0.1s; }
.pay-btn:hover { opacity: 0.92; transform: translateY(-1px); }
.pay-btn-stripe { background: linear-gradient(135deg, #635bff, #4f46e5); color: #fff; box-shadow: 0 4px 20px rgba(99,91,255,0.35); }
.pay-btn-paypal { background: linear-gradient(135deg, #ffc439, #f0a500); color: #1a1a1a; }
.pay-btn-gems { background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff; box-shadow: 0 4px 20px rgba(124,58,237,0.35); }
.pay-btn-cart { background: transparent; border: 1px solid #4c1d95; color: #a855f7; }
.pay-btn-cart:hover { background: rgba(124,58,237,0.1); }
.pay-divider { display: flex; align-items: center; gap: 12px; color: #2a1060; font-size: 12px; }
.pay-divider::before, .pay-divider::after { content: ''; flex: 1; height: 1px; background: #1a0a40; }
.no-link-msg { display: flex; align-items: center; justify-content: center; width: 100%; padding: 16px; background: #080f1c; color: #2a3a55; border: 1px dashed #1a0a40; border-radius: 10px; font-size: 14px; gap: 8px; }
.gems-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.3); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: #a855f7; font-weight: 600; margin-bottom: 14px; }
.gems-result { margin-top: 10px; padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; display: none; }
.gems-result.success { background: rgba(5,46,22,0.8); border: 1px solid #166534; color: #4ade80; }
.gems-result.error { background: rgba(45,10,10,0.8); border: 1px solid #7f1d1d; color: #f87171; }
</style>
<link rel="stylesheet" href="/hydra-theme.css">
</head>
<body>
<nav>
  <a class="nav-logo-text" href="/">HYDRA</a>
  <div class="nav-right" id="account-area">
    <a href="/auth/discord" style="background:#7c3aed;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;">Login</a>
  </div>
</nav>

<div class="page">
  <a class="back-link" href="/store.html">← Back to Store</a>
  <div id="checkout-content"><p style="color:#5b21b6;">Loading…</p></div>
</div>

<script>
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const itemId = window.location.pathname.split("/").pop();

async function init() {
    const [itemsRes, userRes, credRes] = await Promise.all([
        fetch("/api/store-items"),
        fetch("/user"),
        fetch("/api/credits/me")
    ]);
    const items = await itemsRes.json();
    const user = await userRes.json();
    const cred = await credRes.json();
    const item = items.find(i => String(i.id) === String(itemId));

    if (user.loggedIn) {
        document.getElementById("account-area").innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;">
                <img src="${user.avatar}" style="width:32px;height:32px;border-radius:50%;border:2px solid #7c3aed;">
                <span style="color:#fff;font-size:14px;">${user.username}</span>
                <a href="/logout" style="color:#f87171;font-size:13px;text-decoration:none;font-weight:700;">Logout</a>
            </div>`;
    }

    if (!item) {
        document.getElementById("checkout-content").innerHTML = `<p style="color:#f87171;">Item not found. <a href="/store.html" style="color:#a855f7;">Back to store</a></p>`;
        return;
    }

    const gemsBalance = cred.loggedIn ? Math.floor(parseFloat(cred.balance || 0)) : 0;
    const priceNum = parseFloat((item.price||"").replace(/[^0-9.]/g,"")) || 0;
    const hasEnoughGems = gemsBalance >= priceNum;

    let payButtons = "";

    if (item.stripeLink) {
        payButtons += `<button class="pay-btn pay-btn-stripe" onclick="payStripe()">💳 Pay with Card (Stripe)</button>`;
        payButtons += `<div class="pay-divider">or</div>`;
    }
    if (item.paypalLink || window._paypalDefault) {
        const ppLink = item.paypalLink || window._paypalDefault || "";
        if (ppLink) payButtons += `<a class="pay-btn pay-btn-paypal" href="${esc(ppLink)}" target="_blank">🅿 Pay with PayPal</a><div class="pay-divider">or</div>`;
    }

    if (user.loggedIn) {
        payButtons += `<div>
            <div class="gems-pill">💎 Your gems: ${gemsBalance}</div>
            <button class="pay-btn pay-btn-gems" onclick="payWithGems()" ${!hasEnoughGems ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>
                💎 Buy with Gems ${hasEnoughGems ? "" : `(need ${priceNum} gems)`}
            </button>
            <div id="gems-result" class="gems-result"></div>
        </div>`;
        payButtons += `<div class="pay-divider">or</div>`;
    } else {
        payButtons += `<a class="pay-btn pay-btn-gems" href="/auth/discord">🔗 Login with Discord to use Gems</a><div class="pay-divider">or</div>`;
    }

    payButtons += `<a class="pay-btn pay-btn-cart" href="/store.html">← Back to Store</a>`;

    document.getElementById("checkout-content").innerHTML = `
        <div class="item-summary">
            ${item.imageUrl ? `<img class="item-summary-img" src="${esc(item.imageUrl)}" onerror="this.classList.add('hidden')">` : ""}
            <div>
                <div class="item-summary-name">${esc(item.name)}</div>
                <div class="item-summary-price">${esc(item.price)}</div>
            </div>
        </div>
        <div class="pay-buttons">${payButtons}</div>`;
}

async function payStripe() {
    const res = await fetch("/api/create-checkout-session", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ itemId })
    });
    const data = await res.json();
    if (data.url) { window.location.href = data.url; }
    else { alert("Stripe error: " + data.error); }
}

async function payWithGems() {
    const resultEl = document.getElementById("gems-result");
    resultEl.style.display = "block";
    resultEl.className = "gems-result";
    resultEl.textContent = "Processing…";
    const res = await fetch("/api/pay-with-credits", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ itemId })
    });
    const data = await res.json();
    if (res.ok) {
        resultEl.className = "gems-result success";
        resultEl.textContent = `✓ Purchased! ${data.roleAssigned ? "Discord role assigned." : ""} Gems remaining: ${Math.floor(data.newBalance)}`;
        if (data.zipUrl) {
            setTimeout(() => { window.location.href = data.zipUrl; }, 2000);
        }
    } else {
        resultEl.className = "gems-result error";
        resultEl.textContent = `✗ ${data.error}`;
    }
}

init();
</script>
</body>
</html>
