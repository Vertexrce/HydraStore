<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Vertex 6X</title>
<link rel="stylesheet" href="style.css">
<style>
.checkout-wrap {
    max-width: 540px;
    margin: 60px auto;
    padding: 0 20px 80px;
}
.checkout-card {
    background: #0c172b;
    border: 1px solid #1c3c8a;
    border-radius: 18px;
    padding: 36px;
    margin-bottom: 24px;
}
.checkout-card h2 {
    font-size: 26px;
    color: white;
    margin-bottom: 6px;
}
.checkout-price {
    font-size: 34px;
    font-weight: bold;
    color: #4d8dff;
    margin: 10px 0 18px;
}
.checkout-features {
    color: #8899bb;
    font-size: 14px;
    line-height: 1.8;
    border-top: 1px solid #1c3c8a;
    padding-top: 16px;
    margin-bottom: 28px;
}
.checkout-features span {
    display: block;
}
.pay-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: opacity 0.2s, transform 0.1s;
}
.pay-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.pay-btn:active { transform: translateY(0); }
.no-link-msg {
    display: block;
    width: 100%;
    padding: 16px;
    background: #07101f;
    color: #4a5a7a;
    border: 1px solid #1c3c8a;
    border-radius: 12px;
    font-size: 15px;
    text-align: center;
}
.bypass-section {
    background: #0a0f1e;
    border: 1px solid #7c3aed;
    border-radius: 18px;
    padding: 28px;
    margin-top: 24px;
}
.bypass-section h3 {
    color: #a78bfa;
    font-size: 16px;
    margin-bottom: 6px;
}
.bypass-section p {
    color: #6b7a99;
    font-size: 13px;
    margin-bottom: 18px;
}
.bypass-input {
    background: #07101f;
    border: 1px solid #4c3a8a;
    border-radius: 10px;
    color: white;
    padding: 12px 14px;
    font-size: 15px;
    width: 100%;
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.2s;
}
.bypass-input:focus { border-color: #7c3aed; }
.bypass-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
}
.bypass-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.bypass-btn:active { transform: translateY(0); }
.bypass-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.result-box {
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    display: none;
}
.result-box.success { background: #052e16; border: 1px solid #16a34a; color: #4ade80; }
.result-box.error { background: #2d0a0a; border: 1px solid #dc2626; color: #f87171; }
.back-link {
    display: inline-block;
    color: #4a5a7a;
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 24px;
    transition: color 0.2s;
}
.back-link:hover { color: #4d8dff; }
.loading { color: #4a5a7a; text-align: center; padding: 60px; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <img src="vertex-logo.png" alt="Vertex 6X">
    </div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="store.html">Store</a></li>
    </ul>
    <a href="/admin-login.html" class="admin-cog-btn" title="Admin Setup">⚙</a>
</nav>

<div class="checkout-wrap">
    <a href="store.html" class="back-link">← Back to Store</a>

    <div id="checkout-content">
        <div class="loading">Loading...</div>
    </div>
</div>

<style>
.admin-cog-btn {
    font-size: 22px;
    color: #4a5a7a;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 8px;
    transition: color 0.2s, background 0.2s;
    line-height: 1;
}
.admin-cog-btn:hover {
    color: #4d8dff;
    background: rgba(37, 99, 235, 0.12);
}
</style>

<script>
const itemId = location.pathname.split("/").pop();

async function init() {
    const res = await fetch(`/api/checkout/${itemId}`);
    if (!res.ok) {
        document.getElementById("checkout-content").innerHTML =
            '<p style="color:#f87171;text-align:center;padding:40px">Item not found.</p>';
        return;
    }
    const item = await res.json();
    render(item);
}

function render(item) {
    const lines = (item.description || "").split("\n").filter(l => l.trim());
    const featuresHtml = lines.map(l => `<span>✓ ${l.trim()}</span>`).join("");

    const payBtn = item.buyLink
        ? `<a href="/buy/${item.id}" class="pay-btn">💳 Pay Now — ${item.price}</a>`
        : `<span class="no-link-msg">Payment link not set up yet — contact admin</span>`;

    const bypassSection = item.isAdmin ? `
        <div class="bypass-section">
            <h3>⚡ Admin Bypass</h3>
            <p>Enter the customer's Discord User ID to skip payment and assign their role automatically.</p>
            <input
                class="bypass-input"
                id="discord-user-id"
                type="text"
                placeholder="Discord User ID (e.g. 123456789012345678)"
                autocomplete="off"
            >
            <button class="bypass-btn" id="bypass-btn" onclick="doBypass('${esc(item.name)}', '${esc(item.price)}', ${item.id}, '${esc(item.roleId || "")}')">
                ⚡ Bypass &amp; Assign Role
            </button>
            <div class="result-box" id="bypass-result"></div>
            ${!item.roleId ? '<p style="color:#f59e0b;font-size:12px;margin-top:12px;">⚠️ No role ID set for this item. Add one in the admin panel to auto-assign roles.</p>' : ''}
        </div>
    ` : "";

    document.getElementById("checkout-content").innerHTML = `
        <div class="checkout-card">
            <h2>${item.name}</h2>
            <div class="checkout-price">${item.price}</div>
            <div class="checkout-features">${featuresHtml}</div>
            ${payBtn}
        </div>
        ${bypassSection}
    `;
}

function esc(str) {
    return String(str || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
}

async function doBypass(itemName, itemPrice, itemId, roleId) {
    const discordUserId = document.getElementById("discord-user-id").value.trim();
    if (!discordUserId) {
        alert("Please enter a Discord User ID first.");
        return;
    }

    const btn = document.getElementById("bypass-btn");
    const resultBox = document.getElementById("bypass-result");
    btn.disabled = true;
    btn.textContent = "Processing...";
    resultBox.style.display = "none";

    try {
        const res = await fetch("/api/bypass-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ itemId, itemName, itemPrice, roleId, discordUserId })
        });
        const data = await res.json();

        if (res.ok) {
            if (data.roleAssigned) {
                resultBox.className = "result-box success";
                resultBox.textContent = `✓ Bypass recorded and Discord role assigned to user ${discordUserId}!`;
            } else if (data.roleError) {
                resultBox.className = "result-box error";
                resultBox.textContent = `✓ Bypass recorded, but role assignment failed: ${data.roleError}`;
            } else {
                resultBox.className = "result-box success";
                resultBox.textContent = "✓ Bypass recorded! (No role ID configured — set one in admin panel to auto-assign roles.)";
            }
            resultBox.style.display = "block";
            btn.textContent = "✓ Done";
            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = "⚡ Bypass & Assign Role";
                document.getElementById("discord-user-id").value = "";
                resultBox.style.display = "none";
            }, 4000);
        } else {
            resultBox.className = "result-box error";
            resultBox.textContent = `✗ ${data.error || "Bypass failed — are you logged in as admin?"}`;
            resultBox.style.display = "block";
            btn.disabled = false;
            btn.textContent = "⚡ Bypass & Assign Role";
        }
    } catch {
        resultBox.className = "result-box error";
        resultBox.textContent = "✗ Network error. Try again.";
        resultBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "⚡ Bypass & Assign Role";
    }
}

init();
</script>

</body>
</html>
